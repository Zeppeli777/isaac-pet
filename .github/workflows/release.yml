name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow (asset pipeline)
        run: python3 -m pip install --upgrade pillow

      - name: Build app (regenerate + validate assets)
        env:
          ISAAC_APP_VERSION: ${{ github.ref_name }}
        run: ISAAC_REGENERATE_ASSETS=1 ./scripts/build_app.sh

      - name: Core self-checks
        run: swift run -c release IsaacPetCoreChecks

      - name: Verify bundle
        run: ./scripts/verify_app.sh

      - name: Package app
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd dist
          ditto -c -k --sequesterRsrc --keepParent "Isaac Pet.app" "IsaacPet-${VERSION}.zip"
          shasum -a 256 "IsaacPet-${VERSION}.zip" > "IsaacPet-${VERSION}.zip.sha256"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/IsaacPet-*.zip \
            dist/IsaacPet-*.zip.sha256 \
            --title "Isaac Pet ${GITHUB_REF_NAME}" \
            --generate-notes
